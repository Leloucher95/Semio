# Semio en production avec Docker Compose (Dokploy). Un seul service, un seul réplica : SQLite n'accepte qu'un écrivain.
# Aucun port n'est publié sur l'hôte : le domaine et le HTTPS sont ajoutés dans Dokploy (onglet Domains → port 8090),
# qui branche lui-même Traefik sur ce service au déploiement. Ne pas ajouter `ports:` ni de labels Traefik ici.
#
# Les valeurs viennent du fichier .env que Dokploy écrit à côté de ce fichier (onglet Environment). Voir .env.example.
services:
  semio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8090"
    environment:
      APP_ENV: production
      # Obligatoires : le déploiement échoue avec un message clair plutôt que de démarrer mal configuré.
      APP_URL: ${APP_URL:?APP_URL manquant (ex. https://semio.example.com)}
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?PB_ENCRYPTION_KEY manquant (32 caractères, à conserver hors du serveur)}
      # Sauvegardes Cloudflare R2. Incomplètes = sauvegardes désactivées et alerte dans les journaux : ne pas ouvrir au public.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BACKUPS_BUCKET: ${R2_BACKUPS_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_FORCE_PATH_STYLE: ${R2_FORCE_PATH_STYLE:-true}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Traefik écrit X-Forwarded-For. Derrière le proxy Cloudflare (nuage orange) : CF-Connecting-IP.
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-X-Forwarded-For}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
    volumes:
      # Chemin exact du dossier de données PocketBase (`serve --dir=/pb_data`) : base SQLite, journaux, réglages chiffrés.
      - pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Durcissement : le conteneur n'écrit que dans son volume et dans un /tmp en mémoire.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  # Volume nommé : il survit aux redéploiements et à la recréation du conteneur. Ne jamais lancer `down -v`.
  pb_data:
